<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art Collage</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        form { margin-bottom: 20px; }
    </style>
</head>
<body>
    <h1>Create Art Collage</h1>
    {% if error %}<p style="color:red;">{{ error }}</p>{% endif %}
    <form method="POST" enctype="multipart/form-data">
        <label for="style">Style prompt:</label>
        <input type="text" id="style" name="style" required><br><br>
        <label for="images">Upload images:</label>
        <input type="file" id="images" name="images" multiple accept="image/*" required><br><br>
        <button type="submit">Create Collage</button>
    </form>
</body>
</html>
